name: Migrate Yarn mappings to Mojang
on:
  push:
    branches: [port/26.3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/26.3
          path: irl-editor
      - uses: actions/checkout@v4
        with:
          repository: necusiqq/irl-core
          ref: port/26.3
          path: irl-core
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Core sources were migrated to Mojang names; its build now uses official mappings.
      - name: Publish irl-core to Maven Local
        working-directory: irl-core
        run: bash ./gradlew publishToMavenLocal
      - name: Migrate editor main source set
        working-directory: irl-editor
        run: bash ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup
      - name: Migrate editor client source set
        working-directory: irl-editor
        run: bash ./gradlew migrateClientMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup
      - name: Commit migrated sources
        working-directory: irl-editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: migrate editor sources to Mojang mappings"
            git push
          fi
