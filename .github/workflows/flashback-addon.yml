name: Build Flashback Lighting Addon (Minecraft 26.3)
on:
  push:
    branches: [flashback-addon/prototype]
    paths:
      - 'flashback-addon/**'
      - '.github/workflows/flashback-addon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build addon
        working-directory: flashback-addon
        run: gradle clean build
      - name: Upload addon jar
        uses: actions/upload-artifact@v4
        with:
          name: flashback-lighting-addon-minecraft-26.3
          path: flashback-addon/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
